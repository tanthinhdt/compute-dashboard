# Safe default: only this machine, without external accounts or credentials.
server:
  host: 127.0.0.1
  port: 8080
  refresh_interval_seconds: 10
security:
  enabled: true
  allowed_networks: [127.0.0.1/32, '::1/128']
  trusted_proxies: []
  cors_origins: []
user_identifiers: []
organizations:
  - id: resources
    name: Compute Resources
    clusters:
      - id: workstation
        name: Workstation
        type: workstation
        nodes:
          - id: local
            name: Local workstation
            role: Local host
